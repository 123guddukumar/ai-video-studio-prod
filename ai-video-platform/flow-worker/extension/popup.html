<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Google Flow Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06020f 100%);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(255, 255, 255, 0.15);
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      --primary-glow: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --status-disconnected: #ef4444;
      --status-connected: #10b981;
      --status-working: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      padding: 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--primary-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 16px;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .title-area h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
    }

    .title-area span {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Glass Cards */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
    }

    /* Status Bar */
    .status-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--status-disconnected);
      box-shadow: 0 0 10px var(--status-disconnected);
      position: relative;
    }

    .status-dot.connected {
      background-color: var(--status-connected);
      box-shadow: 0 0 10px var(--status-connected);
      animation: pulse-green 2s infinite;
    }

    .status-dot.working {
      background-color: var(--status-working);
      box-shadow: 0 0 10px var(--status-working);
      animation: pulse-orange 1.5s infinite;
    }

    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes pulse-orange {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    /* Form Fields */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field-group label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    /* Buttons */
    .primary-btn {
      width: 100%;
      background: var(--primary-gradient);
      border: none;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--primary-glow);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .primary-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px var(--primary-glow);
    }

    .primary-btn:active {
      transform: translateY(1px);
    }

    .primary-btn.disconnect {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    /* Logs Card */
    .logs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .logs-title {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
      text-decoration: underline;
    }

    .clear-btn:hover {
      color: var(--text-main);
    }

    .logs-console {
      height: 120px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      word-break: break-all;
    }

    .log-entry {
      line-height: 1.3;
      border-left: 2px solid var(--text-muted);
      padding-left: 6px;
    }

    .log-entry.info {
      color: #38bdf8;
      border-left-color: #38bdf8;
    }

    .log-entry.success {
      color: #34d399;
      border-left-color: #34d399;
    }

    .log-entry.warning {
      color: #fbbf24;
      border-left-color: #fbbf24;
    }

    .log-entry.error {
      color: #f87171;
      border-left-color: #f87171;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <div class="logo-icon">F</div>
      <div class="title-area">
        <h1>Flow Automation</h1>
        <span>Google Flow Runner Extension</span>
      </div>
    </div>
  </header>

  <div class="glass-card status-section">
    <div class="status-label">Runner Status</div>
    <div class="status-badge">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Disconnected</span>
    </div>
  </div>

  <div class="glass-card">
    <div class="field-group">
      <label for="server-url">Flow Worker Server URL</label>
      <input type="text" id="server-url" class="input-field" value="http://localhost:8001">
    </div>
    <button id="connect-btn" class="primary-btn">Connect Runner</button>
  </div>

  <div class="glass-card" style="margin-bottom: 0;">
    <div class="logs-header">
      <div class="logs-title">Automation Logs</div>
      <button id="clear-btn" class="clear-btn">Clear</button>
    </div>
    <div id="logs-console" class="logs-console">
      <div class="log-entry info">Extension loaded. Configure URL and click Connect.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
