
services:
  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: aivp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: videogen
      POSTGRES_PASSWORD: videogen
      POSTGRES_DB: videogendb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videogen -d videogendb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aivp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────────
  # Backend (FastAPI)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: aivp-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://videogen:videogen@postgres:5432/videogendb
      - DATABASE_URL_SYNC=postgresql://videogen:videogen@postgres:5432/videogendb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOCAL_STORAGE_PATH=/app/storage/projects
    volumes:
      - ./backend:/app
      - shared_storage:/app/storage/projects
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ─────────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: aivp-celery
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://videogen:videogen@postgres:5432/videogendb
      - DATABASE_URL_SYNC=postgresql://videogen:videogen@postgres:5432/videogendb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOCAL_STORAGE_PATH=/app/storage/projects
      - FLOW_WORKER_URL=http://flow-worker:8001
      - VIDEO_WORKER_URL=http://video-worker:8002
    volumes:
      - ./backend:/app
      - shared_storage:/app/storage/projects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q celery,script,assets,voice,video

  # ─────────────────────────────────────────────
  # Celery Beat (Scheduler)
  # ─────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: aivp-celery-beat
    restart: unless-stopped
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    command: celery -A app.workers.celery_app beat --loglevel=info

  # ─────────────────────────────────────────────
  # Flow Worker (Playwright Browser Automation)
  # ─────────────────────────────────────────────
  flow-worker:
    build:
      context: ./flow-worker
      dockerfile: ../docker/Dockerfile.flow-worker
    container_name: aivp-flow-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - LOCAL_STORAGE_PATH=/app/storage/projects
      - FLOW_CHROMIUM_PROFILE_PATH=/app/chrome-profile
    volumes:
      - ./flow-worker:/app
      - shared_storage:/app/storage/projects
      - chrome_profile:/app/chrome-profile
    ports:
      - "8001:8001"
    # shm_size needed for Chromium
    shm_size: '2gb'

  # ─────────────────────────────────────────────
  # Video Worker (FFmpeg)
  # ─────────────────────────────────────────────
  video-worker:
    build:
      context: ./video-worker
      dockerfile: ../docker/Dockerfile.video-worker
    container_name: aivp-video-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - LOCAL_STORAGE_PATH=/app/storage/projects
    volumes:
      - ./video-worker:/app
      - shared_storage:/app/storage/projects
    ports:
      - "8002:8002"

  # ─────────────────────────────────────────────
  # Frontend (Next.js)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run build && npm run start"

volumes:
  postgres_data:
  redis_data:
  shared_storage:
  chrome_profile:
